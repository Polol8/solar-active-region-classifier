[project]
name = "solar-classifier"
version = "0.1.0"
description = "YOLOv11 detector for solar active regions in SDO/HMI magnetograms"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Scientific / solar physics stack
    "sunpy[all]>=5.1",
    "astropy>=5.3",
    "numpy>=1.24",
    "pandas>=2.0",
    # Image processing
    "pillow>=10.0",
    "opencv-python>=4.8",
    "scikit-image>=0.21",
    # Deep learning
    "ultralytics>=8.3",
    "torch>=2.1",
    "torchvision>=0.16",
    # Utilities
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "tqdm>=4.66",
    "pyyaml>=6.0",
    "rich>=13.0",
    # JSOC / VSO data access
    "drms>=0.7",
    "zeep>=4.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.uv]
# Application project — not a publishable package
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "-v"
# Adds the project root to sys.path so `from src.x import ...` works without installing
pythonpath = ["."]

[tool.coverage.run]
source = ["src"]
omit   = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
